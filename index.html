<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的旅行足跡</title>
<style>
:root{
--bg1:#dff1fd;--bg2:#f7fbff;--ink:#17324a;--muted:#5b7186;
--glass:rgba(255,255,255,.74);--glass2:rgba(255,255,255,.58);
--border:rgba(255,255,255,.70);--line:rgba(23,50,74,.10);
--accent:#2f8fe0;--accent2:#7cc4f2;--green:#2fbf71;--amber:#f5a524;--red:#ef4444;
--shadow:0 8px 22px rgba(31,98,159,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK","PingFang HK",sans-serif;padding-bottom:104px;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,#eaf6ff);position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.45}
body::before{width:420px;height:420px;background:radial-gradient(circle at 30% 30%,#9fd4ff,#dff1fd);top:-140px;left:-120px}
body::after{width:380px;height:380px;background:radial-gradient(circle at 70% 70%,#c9e9ff,#eef8ff);bottom:-140px;right:-120px}
header{position:sticky;top:0;z-index:20;margin:12px 12px 0;padding:14px 16px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--border);box-shadow:var(--shadow)}
h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px;margin-top:3px}
main{padding:16px 14px 20px;max-width:760px;margin:auto}
.card{background:var(--glass);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--border);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--glass2);border:1px solid var(--border);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 12px rgba(31,98,159,.07)}
.stat b{display:block;font-size:22px;color:var(--accent)}.stat span{font-size:11px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input,select,textarea{width:100%;background:rgba(255,255,255,.82);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px;font-size:15px;box-shadow:inset 0 1px 2px rgba(23,50,74,.04)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,143,224,.35);border-color:var(--accent)}
textarea{min-height:96px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}
button{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),#5aa9ec);color:#fff;width:100%;box-shadow:0 8px 20px rgba(47,143,224,.22)}
button.ghost{background:rgba(255,255,255,.60);color:var(--ink);border:1px solid var(--border);box-shadow:none}
button.small{padding:9px 12px;font-size:13px;width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:12px 0}
.chip{white-space:nowrap;background:rgba(255,255,255,.65);border:1px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.active{background:linear-gradient(135deg,var(--accent),#5aa9ec);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,143,224,.22)}
.item{background:var(--glass);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--border);border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.item img{width:100%;max-height:240px;object-fit:cover;display:block}
.body{padding:14px}.title{font-weight:800;font-size:16px}.meta{color:var(--muted);font-size:12px;margin:4px 0 10px}
.note{white-space:pre-wrap;font-size:14px;line-height:1.55}
.badge{display:inline-block;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px;background:rgba(255,255,255,.55)}
.badge.done{color:#177245;background:rgba(47,191,113,.14);border-color:rgba(47,191,113,.3)}
.badge.want{color:#9a6200;background:rgba(245,165,36,.16);border-color:rgba(245,165,36,.35)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{padding:9px 12px;font-size:13px;width:auto}
.maps{display:flex;gap:10px;margin-top:12px}.maps a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;padding:11px;border-radius:14px}
.maps .view{background:rgba(255,255,255,.70);color:#1c5f96;border:1px solid var(--border)}
.maps .nav{background:linear-gradient(135deg,var(--accent),#5aa9ec);color:#fff;box-shadow:0 6px 16px rgba(47,143,224,.22)}
.embed{margin-top:12px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.80);border:1px solid var(--border)}.embed iframe{width:100%;min-height:420px;border:0}
.link{display:inline-block;color:var(--accent);font-size:13px;text-decoration:none;margin-top:8px;word-break:break-all}
.empty{text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}
nav{position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.80);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);border-radius:22px;display:flex;z-index:30;padding:6px;box-shadow:0 10px 26px rgba(31,98,159,.14);padding-bottom:calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
nav button{background:none;color:var(--muted);font-size:10px;padding:8px 10px 10px;border-radius:16px;white-space:nowrap}
nav button.active{color:#fff;background:linear-gradient(135deg,var(--accent),#5aa9ec);box-shadow:0 6px 16px rgba(47,143,224,.22)}
nav span{display:block;font-size:19px;margin-bottom:2px}
.fab{position:fixed;right:18px;bottom:96px;z-index:35;width:58px;height:58px;border-radius:50%;font-size:27px;background:linear-gradient(135deg,var(--accent),#5aa9ec);box-shadow:0 12px 28px rgba(47,143,224,.28)}
.modal{position:fixed;inset:0;background:rgba(23,50,74,.28);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:50;display:none;overflow:auto;padding:16px}.modal.open{display:block}
.sheet{background:rgba(255,255,255,.90);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--border);border-radius:24px;max-width:620px;margin:24px auto;padding:18px;box-shadow:0 16px 40px rgba(31,98,159,.18)}
.hidden{display:none!important}
.weather-main{display:flex;align-items:center;gap:12px}.weather-icon{font-size:42px}.temp{font-size:34px;font-weight:800;color:#1c5f96}
.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.day{background:var(--glass2);border:1px solid var(--border);border-radius:16px;padding:10px;text-align:center}
.day b{display:block;font-size:13px}.day span{font-size:11px;color:var(--muted)}
.result{margin-top:12px;padding:14px;background:var(--glass2);border:1px solid var(--border);border-radius:16px;font-size:15px}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);color:#177245;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s}
.savebar.show{opacity:1}
.savebar.error{color:#b42318}
</style>
</head>
<body>

<header><h1>🌍 我的旅行足跡</h1><div class="sub">餐廳 · 景點 · 購物 · 遊記 · 匯率</div></header>

<main>
<section id="view-home">
<div class="card"><div class="grid">
<div class="stat"><b id="sCountries">0</b><span>國家</span></div>
<div class="stat"><b id="sVisited">0</b><span>已到訪</span></div>
<div class="stat"><b id="sWishlist">0</b><span>想去</span></div>
</div></div>
<div class="card"><b>最近記錄</b><div id="recent" style="margin-top:10px"></div></div>
<div id="collectionFilterBar" class="hidden" style="margin-bottom:12px"><button class="ghost" onclick="clearCollectionFilter()">✕ 清除收藏夾篩選</button></div>
<input id="search" placeholder="搜尋餐廳、景點、物品或筆記…" oninput="render()">
<div class="chips" id="filters"></div>
<div id="items"></div>
</section>

<section id="view-map" class="hidden">
<div class="card">
<b>✨ 自訂收藏夾</b>
<p class="sub">建立例如「東京必食」、「大阪購物」或「2027 日本行程」。</p>
<div class="row" style="margin-top:10px"><input id="collectionName" placeholder="收藏夾名稱"><button style="width:auto" onclick="addCollection()">＋</button></div>
<div id="collections" style="margin-top:12px"></div>
</div>
<div class="card"><b>國家總覽</b><p class="sub">點擊國家查看該國所有記錄。</p></div>
<div id="countries"></div>
</section>

<section id="view-fx" class="hidden">
<div class="card"><b>💱 匯率換算</b><p class="sub">使用網上即時匯率資料換算旅行預算。</p>
<label>金額</label><input id="fxAmount" type="number" inputmode="decimal" value="1000">
<div class="row"><div><label>由</label><select id="fxFrom"></select></div><div><label>至</label><select id="fxTo"></select></div></div>
<button style="margin-top:12px" onclick="convert()">立即換算</button>
<div id="fxResult"></div></div>
</section>

<section id="view-settings" class="hidden">
<div class="card"><b>預設設定</b><p class="sub">設定匯率預設貨幣。</p>
<div class="row"><div><label>預設來源貨幣</label><select id="prefFrom"></select></div><div><label>預設目標貨幣</label><select id="prefTo"></select></div></div>
<button style="margin-top:12px" onclick="savePrefs()">儲存設定</button></div>

<div class="card"><b>資料備份</b><p class="sub">資料儲存在此裝置瀏覽器。建議定期匯出備份檔。</p>
<div class="row" style="margin-top:10px"><button class="ghost" onclick="exportData()">匯出 JSON</button>
<label class="ghost" style="display:block;text-align:center;padding:12px">匯入備份<input type="file" accept=".json" hidden onchange="importData(this)"></label></div></div>

<div class="card"><b>清除所有資料</b><p class="sub">此操作不可復原。</p>
<button style="background:var(--red)" onclick="if(confirm('確定清除所有記錄及收藏夾？')){localStorage.removeItem('travelData');localStorage.removeItem('travelCollections');localStorage.removeItem('travelPrefs');location.reload()}">清除資料</button></div>
</section>
</main>

<button class="fab" onclick="openForm()">＋</button>

<nav>
<button class="active" data-v="home" onclick="go('home')"><span>🏠</span>總覽</button>
<button data-v="map" onclick="go('map')"><span>🗺️</span>國家</button>
<button data-v="fx" onclick="go('fx')"><span>💱</span>匯率</button>
<button data-v="settings" onclick="go('settings')"><span>⚙️</span>設定</button>
</nav>

<div class="savebar" id="savebar">✅ 已儲存</div>

<div class="modal" id="formModal"><div class="sheet">
<h2 id="formTitle">新增記錄</h2>
<label>國家 *</label><input id="country" placeholder="例如：日本">
<label>城市／地區</label><input id="city" placeholder="例如：東京">
<label>類別 *</label><select id="category"><option value="restaurant">🍽️ 餐廳</option><option value="attraction">📍 景點</option><option value="shopping">🛍️ 想買的東西</option><option value="note">📝 遊記／筆記</option></select>
<label>名稱 *</label><input id="name" placeholder="例如：一蘭拉麵">
<label>收藏夾</label><select id="collectionId"><option value="">未分類</option></select>
<label>Google Maps 地點／地址</label><input id="mapLocation" placeholder="例如：東京都新宿区… 或貼上 Google Maps 連結">
<label>狀態</label><select id="status"><option value="want">想去／想買</option><option value="done">已去／已買</option></select>
<label>評分（0–5）</label><input id="rating" type="number" min="0" max="5" step="0.5" placeholder="可留空">
<label>文字記錄</label><textarea id="note" placeholder="地址、感想、必食、價錢、開放時間…"></textarea>
<label>相片</label><input id="photo" type="file" accept="image/*" multiple>
<label>Instagram Reels／Threads 連結</label><input id="social" placeholder="貼上公開 Reels 或 Threads 連結">
<div class="row" style="margin-top:16px"><button class="ghost" onclick="closeForm()">取消</button><button onclick="saveForm()">儲存</button></div>
</div></div>

<script>
const KEY='travelData',PKEY='travelPrefs',CKEY='travelCollections';
let data={entries:[]},collections=[],editing=null,filter='all',collectionFilter='';
let prefs=JSON.parse(localStorage.getItem(PKEY)||'null')||{from:'HKD',to:'JPY'};
const cats={restaurant:'🍽️ 餐廳',attraction:'📍 景點',shopping:'🛍️ 購物',note:'📝 筆記'};
const currencies=['HKD','USD','JPY','KRW','TWD','CNY','EUR','GBP','THB','SGD','AUD','CAD','MYR','VND','PHP','IDR'];

function storageOK(){try{localStorage.setItem('__test','1');localStorage.removeItem('__test');return true}catch(e){return false}}
function load(){
if(!storageOK()){alert('此瀏覽器未能使用本機儲存，資料可能無法保存。請避免使用無痕／私密瀏覽模式。');return}
try{data=JSON.parse(localStorage.getItem(KEY))||{entries:[]};collections=JSON.parse(localStorage.getItem(CKEY)||'[]')}catch(e){data={entries:[]};collections=[]}}
function save(){
if(!storageOK()){showSave('⚠️ 無法儲存：瀏覽器儲存空間不可用',true);return}
try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(CKEY,JSON.stringify(collections));showSave('✅ 已儲存');render()}
catch(e){showSave('⚠️ 儲存失敗：儲存空間不足，請刪除部分相片或匯出備份',true);alert('儲存失敗：'+(e.name||'')+'\n建議刪除部分相片，或先匯出 JSON 備份。')}}
function showSave(msg,error){const b=document.getElementById('savebar');b.textContent=msg;b.classList.toggle('error',!!error);b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),1800)}
function savePrefs(){prefs={from:prefFrom.value,to:prefTo.value};localStorage.setItem(PKEY,JSON.stringify(prefs));applyPrefs();showSave('✅ 設定已儲存')}
function applyPrefs(){fxFrom.value=prefs.from;fxTo.value=prefs.to}

function addCollection(){const n=collectionName.value.trim();if(!n)return alert('請輸入收藏夾名稱');collections.push({id:crypto.randomUUID(),name:n});collectionName.value='';save()}
function delCollection(id){if(!confirm('刪除此收藏夾？記錄會保留並改為未分類。'))return;collections=collections.filter(c=>c.id!==id);data.entries=data.entries.map(e=>e.collectionId===id?{...e,collectionId:''}:e);if(collectionFilter===id)collectionFilter='';save()}
function pickCollection(id){collectionFilter=id;go('home');render()}
function clearCollectionFilter(){collectionFilter='';render()}

function go(v){['home','map','fx','settings'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));window.scrollTo(0,0)}
function openForm(id){editing=id||null;const e=id?data.entries.find(x=>x.id===id):null;
formTitle.textContent=e?'編輯記錄':'新增記錄';
country.value=e?.country||'';city.value=e?.city||'';category.value=e?.category||'restaurant';name.value=e?.name||'';collectionId.value=e?.collectionId||'';mapLocation.value=e?.mapLocation||'';status.value=e?.status||'want';rating.value=e?.rating||'';note.value=e?.note||'';social.value=e?.social||'';
refreshCollectionOptions();formModal.classList.add('open')}
function closeForm(){formModal.classList.remove('open')}
function refreshCollectionOptions(){collectionId.innerHTML='<option value="">未分類</option>'+collections.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
async function saveForm(){
if(!country.value.trim()||!name.value.trim())return alert('請填寫國家及名稱');
const photos=[];for(const f of photo.files)photos.push(await compressImage(f));
const old=editing?data.entries.find(x=>x.id===editing):null;
const obj={id:editing||crypto.randomUUID(),country:country.value.trim(),city:city.value.trim(),category:category.value,name:name.value.trim(),collectionId:collectionId.value,mapLocation:mapLocation.value.trim(),status:status.value,rating:rating.value?+rating.value:null,note:note.value,social:social.value.trim(),photos:(old?.photos||[]).concat(photos),created:old?.created||Date.now(),updated_at:new Date().toISOString()};
if(editing)data.entries=data.entries.map(x=>x.id===editing?obj:x);else data.entries.unshift(obj);
closeForm();save()}
function compressImage(file){return new Promise(r=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1280;let{width:w,height:h}=img;if(w>h&&w>max){h*=max/w;w=max}else if(h>w&&h>max){w*=max/h;h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);r(c.toDataURL('image/jpeg',.72));URL.revokeObjectURL(url)};img.onerror=()=>r('');img.src=url})}
function del(id){if(confirm('刪除此記錄？')){data.entries=data.entries.filter(x=>x.id!==id);save()}}
function toggle(id){data.entries=data.entries.map(x=>x.id===id?{...x,status:x.status==='done'?'want':'done',updated_at:new Date().toISOString()}:x);save()}

function mapsSearch(e){const q=encodeURIComponent([e.name,e.city,e.country,e.mapLocation].filter(Boolean).join(', '));return `https://www.google.com/maps/search/?api=1&query=${q}`}
function mapsNav(e){const q=encodeURIComponent(e.mapLocation||[e.name,e.city,e.country].filter(Boolean).join(', '));return `https://www.google.com/maps/dir/?api=1&destination=${q}`}
function filters(){const l=[['all','全部'],['restaurant','🍽️ 餐廳'],['attraction','📍 景點'],['shopping','🛍️ 購物'],['note','📝 筆記'],['done','✅ 已完成'],['want','⭐ 想去／想買']];
document.getElementById('filters').innerHTML=l.map(([k,t])=>`<button class="chip ${filter===k?'active':''}" onclick="filter='${k}';render()">${t}</button>`).join('')}
function match(e){if(collectionFilter&&e.collectionId!==collectionFilter)return false;
if(filter==='done')return e.status==='done';if(filter==='want')return e.status==='want';if(filter!=='all')return e.category===filter;return true}
function socialEmbed(url){if(!url)return'';
if(url.includes('threads.com'))return `<div class="embed"><iframe src="${url.replace(/\/?$/,'')}/embed" loading="lazy" allowfullscreen></iframe></div>`;
if(url.includes('instagram.com'))return `<div class="embed"><blockquote class="instagram-media" data-instgrm-permalink="${url}" data-instgrm-version="14" style="background:#fff;color:#000;max-width:100%;width:100%;padding:0;margin:0"><a href="${url}" target="_blank" rel="noopener">在 Instagram 查看</a></blockquote></div>`;
return `<a class="link" href="${url}" target="_blank" rel="noopener">開啟連結 ↗</a>`}
function card(e){const stars=e.rating?'★'.repeat(Math.round(e.rating))+' '+e.rating:'';const col=collections.find(c=>c.id===e.collectionId);
return `<article class="item">${e.photos?.length?`<img src="${e.photos[0]}">`:''}<div class="body">
<div class="title">${cats[e.category]} ${e.name}</div><div class="meta">${e.country}${e.city?' · '+e.city:''} ${stars}${col?` · 📁 ${col.name}`:''}</div>
<span class="badge ${e.status}">${e.status==='done'?'已去／已買':'想去／想買'}</span>
${e.mapLocation?`<p class="note">📍 ${e.mapLocation.replace(/</g,'&lt;')}</p>`:''}
${e.note?`<p class="note">${e.note.replace(/</g,'&lt;')}</p>`:''}${socialEmbed(e.social)}
<div class="maps"><a class="view" href="${mapsSearch(e)}" target="_blank" rel="noopener">🗺️ 開啟 Google Maps</a><a class="nav" href="${mapsNav(e)}" target="_blank" rel="noopener">🧭 導航</a></div>
<div class="actions"><button class="ghost" onclick="toggle('${e.id}')">${e.status==='done'?'改為想去':'標記已完成'}</button><button class="ghost" onclick="openForm('${e.id}')">編輯</button><button class="ghost" onclick="del('${e.id}')">刪除</button></div>
</div></article>`}

function render(){load();filters();
const q=(document.getElementById('search')?.value||'').toLowerCase(),all=data.entries;
document.getElementById('sCountries').textContent=new Set(all.map(x=>x.country)).size;
document.getElementById('sVisited').textContent=all.filter(x=>x.status==='done').length;
document.getElementById('sWishlist').textContent=all.filter(x=>x.status==='want').length;
const shown=all.filter(match).filter(e=>!q||[e.name,e.country,e.city,e.note,e.mapLocation].join(' ').toLowerCase().includes(q));
document.getElementById('items').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty">沒有符合的記錄。<br>按右下角 ＋ 新增。</div>';
document.getElementById('recent').innerHTML=all.slice(0,3).map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${e.name}</b><div class="meta">${e.country} · ${cats[e.category]}</div></div>`).join('')||'<div class="empty">尚未有記錄</div>';
document.getElementById('collectionFilterBar').classList.toggle('hidden',!collectionFilter);
document.getElementById('collections').innerHTML=collections.map(c=>{const items=all.filter(e=>e.collectionId===c.id),done=items.filter(x=>x.status==='done').length;
return `<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b onclick="pickCollection('${c.id}')" style="cursor:pointer">📁 ${c.name}</b><button class="ghost small" onclick="delCollection('${c.id}')">刪除</button></div><div class="meta">${items.length} 項記錄 · ${done} 項已完成</div></div>`}).join('')||'<div class="empty">尚未建立收藏夾</div>';
const by={};all.forEach(e=>{(by[e.country]??=[]).push(e)});
document.getElementById('countries').innerHTML=Object.keys(by).sort().map(c=>{const d=by[c].filter(x=>x.status==='done').length;return `<div class="card" onclick="collectionFilter='';filter='all';go('home');document.getElementById('search').value='${c}';render()"><b>${c}</b><div class="meta">${by[c].length} 項記錄 · ${d} 項已完成</div></div>`}).join('')||'<div class="empty">尚未加入國家</div>';
if(window.instgrm)instgrm.Embeds.process()}

async function convert(){
const a=+fxAmount.value;if(!a||a<=0)return alert('請輸入金額');
fxResult.innerHTML='<div class="result">正在取得匯率…</div>';
try{const r=await (await fetch(`https://open.er-api.com/v6/latest/${fxFrom.value}`)).json();
const rate=r.rates[fxTo.value];if(!rate)throw 0;
fxResult.innerHTML=`<div class="result"><b>${a.toLocaleString()} ${fxFrom.value}</b> ≈ <b style="color:var(--accent)">${(a*rate).toLocaleString(undefined,{maximumFractionDigits:2})} ${fxTo.value}</b><div class="sub" style="margin-top:6px">1 ${fxFrom.value} = ${rate} ${fxTo.value} · 更新時間：${new Date(r.time_last_update_utc).toLocaleString('zh-HK')}</div></div>`
}catch(e){fxResult.innerHTML='<div class="result">暫時無法取得匯率，請檢查網絡後再試。</div>'}}

function exportData(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({entries:data.entries,collections},null,2));a.download='travel-tracker-backup.json';a.click()}
function importData(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.entries)throw 0;data={entries:d.entries};collections=d.collections||[];save();alert('已匯入')}catch(e){alert('檔案格式不正確')}};r.readAsText(f)}
load();initFx();applyPrefs();render();
function initFx(){const opts=currencies.map(c=>`<option value="${c}">${c}</option>`).join('');fxFrom.innerHTML=opts;fxTo.innerHTML=opts;prefFrom.innerHTML=opts;prefTo.innerHTML=opts}
</script>
