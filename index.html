tton{font-size:11px}.card{padding:22px}.row{grid-template-columns:1fr}.header-tools button{padding:8px}h2{font-size:26px}}

'use strict';

let page='places',folder='',country='',tag='',q='',status='all',sort='default',busy=false;
function save(){try{localStorage.setItem('tracy-notes-v2',JSON.stringify(db))}catch{toast('無法儲存，請匯出備份。')}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.timer);window.timer=setTimeout(()=>$('#toast').style.display='none',4000)}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const fname=id=>db.folders.find(f=>f.id===id)?.name||'未分類';
const total=i=>(Number(i.price)||0)*(i.currency==='JPY'?db.fx.rate:1);
function safe(s){try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function time(s){const d=new Date(s);return isNaN(d)?'未提供':d.toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'})}
function rateText(){return `1 JPY ≈ HK$${Number(db.fx.rate).toFixed(6)} · ${esc(db.fx.source)}${db.fx.fetchedAt?' · 最後成功取得：'+esc(time(db.fx.fetchedAt)):''}${db.fx.error?' · 更新失敗，沿用舊匯率':''}`}
function go(p,f=''){page=p;folder=f;country='';tag='';q='';status='all';sort='default';render();scrollTo(0,0)}
function heading(title,sub,action=''){return `<div class="heading"><div><h2>${title}</h2><div class="muted">${sub}</div></div>${action}</div>`}
function render(){ $('#nav').innerHTML=Object.entries(keys).map(([k,[icon,n]])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${icon}</span>${n}</button>`).join('');if(page==='folders')return folderView();if(page==='settings')return settings();if(page==='ai')return ai();const all=db.items.filter(i=>i.type===page),n=keys[page][1];$('#app').innerHTML=heading(n,page==='wish'?`${all.length} 件產品 · 未買總額 ≈ HK$${all.filter(i=>!i.done).reduce((a,i)=>a+total(i),0).toFixed(0)}`:`${all.length} 個收藏`, `<button class="primary" onclick="edit()">＋ 新增${n}</button>`)+(['wish','places'].includes(page)?`<div class="rate">${rateText()} <a href="#" onclick="event.preventDefault();go('settings')">匯率設定</a></div>`:'')+(page==='places'?`<div class="chips"><button class="chip ${!country?'active':''}" onclick="filter('country','')">全部國家 ${all.length}</button>${[...new Set(all.map(i=>i.country).filter(Boolean))].map(c=>`<button class="chip ${country===c?'active':''}" data-country="${esc(c)}">${esc(c)} ${all.filter(i=>i.country===c).length}</button>`).join('')}</div>`:'')+`<input id="search" placeholder="搜尋名稱、品牌、地址、備註，或者打 #標籤" aria-label="搜尋" value="${esc(q)}"><div class="chips"><button class="chip ${!folder?'active':''}" onclick="filter('folder','')">全部收藏夾</button>${db.folders.map(f=>`<button class="chip ${folder===f.id?'active':''}" onclick="filter('folder','${f.id}')">${esc(f.name)}</button>`).join('')}</div><div class="chips">${[...new Set(all.flatMap(i=>i.tags))].map(t=>`<button class="tag ${tag===t?'active':''}" data-tag="${esc(t)}">#${esc(t)} ${all.filter(i=>i.tags.includes(t)).length}</button>`).join('')}</div><div class="toolbar">${['places','wish'].includes(page)?`<select id="status" aria-label="狀態"><option value="all">全部狀態</option><option value="todo">${page==='wish'?'未買':'未去過'}</option><option value="done">${page==='wish'?'已買':'已去過'}</option></select>`:''}<select id="sort" aria-label="排序"><option value="default">預設排序</option><option value="name">名稱排序</option><option value="price">金額由低至高</option><option value="rating">評分由高至低</option></select><button onclick="go(page)">清除篩選</button></div><div id="list"></div>`;$('#search').oninput=e=>{q=e.target.value;list()};document.querySelectorAll('[data-country]').forEach(e=>e.onclick=()=>filter('country',e.dataset.country));document.querySelectorAll('[data-tag]').forEach(e=>e.onclick=()=>filter('tag',tag===e.dataset.tag?'':e.dataset.tag));if($('#status')){$('#status').value=status;$('#status').onchange=e=>{status=e.target.value;list()}}$('#sort').value=sort;$('#sort').onchange=e=>{sort=e.target.value;list()};list()}
function filter(k,v){if(k==='folder')folder=v;if(k==='country')country=v;if(k==='tag')tag=v;render()}
function list(){const query=q.trim().toLowerCase();let a=db.items.filter(i=>i.type===page&&(!folder||i.folder===folder)&&(!country||i.country===country)&&(!tag||i.tags.includes(tag))&&(status==='all'||!!i.done===(status==='done'))&&(!query||(query.startsWith('#')?i.tags.some(t=>t.toLowerCase().includes(query.slice(1))):[i.name,i.city,i.country,i.address,i.brand,i.shop,i.note,fname(i.folder),...i.tags].join(' ').toLowerCase().includes(query))));if(sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));if(sort==='price')a.sort((a,b)=>total(a)-total(b));if(sort==='rating')a.sort((a,b)=>(b.rating||0)-(a.rating||0));$('#list').innerHTML=a.length?(page==='places'?[...new Set(a.map(i=>i.city||'其他'))].map(c=>`<h3 style="margin-top:24px">⌖ ${esc(c)}</h3><div class="grid">${a.filter(i=>(i.city||'其他')===c).map(card).join('')}</div>`).join(''):`<div class="grid">${a.map(card).join('')}</div>`):'<div class="empty">未有符合條件嘅收藏。</div>'}
function card(i){return `<article class="card">${i.type==='wish'?(safe(i.image)?`<img class="cover" src="${esc(safe(i.image))}" alt="${esc(i.name)}" loading="lazy" referrerpolicy="no-referrer">`:'<div class="placeholder">♧</div>'):''}<div class="top"><h3>${esc(i.name)}</h3><div class="actions"><button onclick="edit('${i.id}')" aria-label="編輯">✎</button><button onclick="removeItem('${i.id}')" aria-label="刪除">×</button></div></div><div class="muted"><span style="color:var(--brown)">♡ ${esc(fname(i.folder))}</span>　${esc(i.brand||i.city||i.country||'')}</div>${['wish','places'].includes(i.type)?`<p><button class="badge ${i.done?'done':''}" onclick="toggle('${i.id}')">${i.done?'✓ ':''}${i.type==='wish'?(i.done?'已買':'未買'):(i.done?'已去過':'未去過')}</button></p>`:''}${i.type==='places'?`<div class="stars">${'★'.repeat(i.rating||0)}${'☆'.repeat(5-(i.rating||0))} <small>${Number(i.rating||0).toFixed(1)}</small></div>`:''}<div class="tags">${i.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${i.address?`<p>⌖ <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.address+' '+i.name)}">${esc(i.address)}</a></p>`:''}${i.shop?`<p class="muted">▤ ${esc(i.shop)}</p>`:''}${i.note?`<p class="muted note">${esc(i.note)}</p>`:''}${safe(i.url)?`<p><a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">↗ 開啟連結</a></p>`:''}${['wish','places'].includes(i.type)?`<p class="price">${i.currency==='JPY'?'¥':'HK$'}${Number(i.price||0).toLocaleString()} ${i.currency==='JPY'?`<small>≈ HK$${total(i).toFixed(1)}</small>`:''}</p>`:''}</article>`}
function folderView(){ $('#app').innerHTML=heading('收藏夾','把地點、想買同貼文按旅程或主題整理。','<button class="primary" onclick="editFolder()">＋ 建立收藏夾</button>')+`<div class="grid">${db.folders.map(f=>`<article class="card folder"><div class="top"><span style="font-size:35px;color:var(--brown)">♡</span><div class="actions"><button onclick="editFolder('${f.id}')">✎</button><button onclick="removeFolder('${f.id}')">×</button></div></div><h3 style="margin-top:25px">${esc(f.name)}</h3><p class="muted">${esc(f.note)}</p><div class="tags">${['places','wish','posts','links','info'].map(k=>`<button class="tag" onclick="go('${k}','${f.id}')">${db.items.filter(i=>i.type===k&&i.folder===f.id).length} ${keys[k][1]}</button>`).join('')}</div><small>${esc(f.country)}</small></article>`).join('')||'<div class="empty">建立你嘅第一個收藏夾。</div>'}</div>`}
function input(label,name,value='',type='text',req=false){return `<label>${label}<input type="${type}" name="${name}" value="${esc(value)}" ${req?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`}
function modal(title,body,done){$('#form').innerHTML=`<div class="top"><h3>${title}</h3><button type="button" onclick="closeModal()">×</button></div>`+body+'<div class="foot"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存</button></div>';$('#form').onsubmit=e=>{e.preventDefault();done(new FormData(e.target))};$('#dialog').showModal()}
function closeModal(){$('#dialog').close()}
function edit(id){const old=db.items.find(i=>i.id===id),i=old||{type:page,folder:folder||db.folders[0]?.id||'',tags:[],currency:'JPY',country:'日本'};modal((old?'編輯':'新增')+keys[i.type][1],input('名稱 *','name',i.name,'text',true)+`<label>收藏夾<select name="folder"><option value="">未分類</option>${db.folders.map(f=>`<option value="${f.id}" ${i.folder===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><div class="row">${input('國家／地區','country',i.country)}${input('城市','city',i.city)}</div>`+input('標籤（空格、逗號或 # 分隔）','tags',i.tags.join(' '))+(['places','wish'].includes(i.type)?`<div class="row">${input('金額','price',i.price||0,'number')}<label>貨幣<select name="currency"><option value="JPY" ${i.currency==='JPY'?'selected':''}>JPY 日圓</option><option value="HKD" ${i.currency==='HKD'?'selected':''}>HKD 港幣</option></select></label></div><label>狀態<select name="done"><option value="false" ${!i.done?'selected':''}>${i.type==='wish'?'未買':'未去過'}</option><option value="true" ${i.done?'selected':''}>${i.type==='wish'?'已買':'已去過'}</option></select></label>`:'')+(i.type==='places'?input('地址','address',i.address)+`<label>評分<select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===(i.rating||0)?'selected':''}>${n} 星</option>`).join('')}</select></label>`:'')+(i.type==='wish'?input('品牌','brand',i.brand)+input('店舖','shop',i.shop)+input('圖片網址（可選）','image',i.image,'url'):'')+input('連結（可選）','url',i.url,'url')+`<label>備註／內容<textarea name="note">${esc(i.note)}</textarea></label>`,fd=>{let x={...i,...Object.fromEntries(fd),id:old?.id||uid(),tags:[...new Set(String(fd.get('tags')).split(/[\s,#，]+/).filter(Boolean))],price:Number(fd.get('price')||0),rating:Number(fd.get('rating')||0),done:fd.get('done')==='true'};x.name=x.name.trim();if(!x.name)return toast('請輸入名稱');if(old)db.items[db.items.findIndex(i=>i.id===id)]=x;else db.items.push(x);save();closeModal();render();toast('已儲存')})}
function editFolder(id){const f=db.folders.find(f=>f.id===id)||{};modal(id?'編輯收藏夾':'建立收藏夾',input('名稱 *','name',f.name,'text',true)+input('描述','note',f.note)+input('國家／地區','country',f.country),fd=>{const x={...Object.fromEntries(fd),id:id||uid()};x.name=x.name.trim();if(!x.name)return toast('請輸入名稱');if(id)db.folders[db.folders.findIndex(f=>f.id===id)]=x;else db.folders.push(x);save();closeModal();render()})}
function removeItem(id){if(confirm('確定刪除？此操作無法還原。')){db.items=db.items.filter(i=>i.id!==id);save();render()}}
function removeFolder(id){if(confirm('刪除收藏夾？內容會保留並移至未分類。')){db.folders=db.folders.filter(f=>f.id!==id);db.items.forEach(i=>{if(i.folder===id)i.folder=''});save();render()}}
function toggle(id){const i=db.items.find(i=>i.id===id);i.done=!i.done;save();render()}
function backup(){const u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='tracy-notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#upload').onchange=async e=>{try{if(!e.target.files[0])return;const x=JSON.parse(await e.target.files[0].text());if(![1,2].includes(x.version)||!Array.isArray(x.items)||!Array.isArray(x.folders))throw Error();const ids=new Set();for(const f of x.folders){if(typeof f.name!=='string'||! /^[\w-]+$/.test(f.id)||ids.has(f.id))throw Error();ids.add(f.id)}const ii=new Set();for(const i of x.items){if(!keys[i.type]||['folders','ai'].includes(i.type)||typeof i.name!=='string'||! /^[\w-]+$/.test(i.id)||ii.has(i.id)||!Array.isArray(i.tags)||!i.tags.every(t=>typeof t==='string')||(i.folder&&!ids.has(i.folder)))throw Error();ii.add(i.id);i.rating=Math.min(5,Math.max(0,Math.round(Number(i.rating)||0)));i.price=Math.max(0,Number(i.price)||0)}const rate=Number(x.fx?.rate||x.rate);if(!Number.isFinite(rate)||rate<=0)throw Error();if(confirm('會取代全部資料，請先備份。確定匯入？')){db={version:2,folders:x.folders,items:x.items,fx:{...structuredClone(initial.fx),rate,source:'匯入匯率'}};save();go('places');toast('已匯入；安全起見需重新設定匯率接口。')}}catch{toast('無效備份，未有更改資料。')}e.target.value=''};
const gas=`// 1. 在 Google Sheets A1 輸入：\n// =GOOGLEFINANCE("CURRENCY:JPYHKD")\n// 2. 等待 A1 出現數值。\n// 3. 擴充功能 → Apps Script，貼上以下程式。\n// 4. 將試算表 ID 改成自己嘅 ID。\n// 5. 部署 → 新增部署 → 網頁應用程式。\n//    以自己身分執行；存取權設為「所有人」。\n// 6. 將 /exec 部署網址貼入網站設定。\nfunction doGet() {\n  try {\n    var sheet = SpreadsheetApp.openById('YOUR_SPREADSHEET_ID').getSheets()[0];\n    var rate = Number(sheet.getRange('A1').getValue());\n    if (!isFinite(rate) || rate <= 0) throw new Error('Rate unavailable');\n    return ContentService.createTextOutput(JSON.stringify({\n      base: 'JPY', quote: 'HKD', rate: rate,\n      source: 'Google Finance via Google Sheets',\n      fetchedAt: new Date().toISOString()\n    })).setMimeType(ContentService.MimeType.JSON);\n  } catch (err) {\n    return ContentService.createTextOutput(JSON.stringify({error:'Rate unavailable'}))\n      .setMimeType(ContentService.MimeType.JSON);\n  }\n}`;
function settings(){$('#app').innerHTML=heading('匯率與資料設定','Google 資料連接 · 每日檢查 · 手動備用')+`<div class="card"><h3>日圓 → 港幣參考匯率</h3><p>${rateText()}</p>${db.fx.quoteTime?`<p class="muted">接口資料取得時間：${esc(time(db.fx.quoteTime))}（並非市場報價時間）</p>`:''}${db.fx.error?`<div class="notice">${esc(db.fx.error)}</div>`:''}<label>Google Apps Script 網頁應用程式網址<input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(db.fx.endpoint)}"></label><div class="toolbar"><button class="primary" onclick="setEndpoint()">儲存接口並更新</button><button onclick="refreshRate(true)" ${busy?'disabled':''}>${busy?'更新中…':'立即更新'}</button><button onclick="disconnect()">停用自動更新</button></div><div class="notice">網站開啟時會按香港日期每日嘗試更新一次；保持頁面開啟時亦會定期檢查是否已跨日。關閉網站期間唔會背景執行。失敗會沿用上次成功匯率，可手動重試。報價可能延遲，換算不包含銀行或信用卡費用。</div><label>手動備用匯率：1 JPY = 幾多 HKD<input id="manual" type="number" min="0.000001" step="0.000001" value="${db.fx.rate}"></label><button onclick="manualRate()">使用手動匯率並停用自動更新</button></div><h3 style="margin-top:28px">首次接駁 Google</h3><div class="notice">純 HTML 未附帶 Google 資料接口。請用你自己嘅 Google 帳戶建立下方接口，完成部署後再貼入網址。接口只回傳匯率，請使用獨立試算表，唔好將私人資料加入公開回應。瀏覽器會向你設定嘅 Google 接口發送請求。若遇到權限或跨來源限制，需檢查部署，或部署同源後端代理；網站會保留舊匯率並顯示錯誤。</div><button onclick="copyCode()">複製 Apps Script 程式</button><pre>${esc(gas)}</pre><div class="notice">所有收藏儲存喺此瀏覽器，無登入或跨裝置同步。請定期匯出。匯入備份會停用舊接口，避免自動連接未確認來源。示範地點及價格不代表最新資訊。</div>`}
function setEndpoint(){const v=$('#endpoint').value.trim();try{const u=new URL(v);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||! /^\/macros\/s\/[^/]+\/exec$/.test(u.pathname))throw Error();db.fx.endpoint=u.href;db.fx.attemptDay='';db.fx.error='';save();refreshRate(true)}catch{toast('請輸入有效 Google Apps Script /exec 部署網址。')}}
function disconnect(){db.fx.endpoint='';db.fx.error='';save();settings();toast('已停用自動更新，保留目前匯率')}
function manualRate(){const r=Number($('#manual').value);if(!Number.isFinite(r)||r<=0)return toast('請輸入有效正數');Object.assign(db.fx,{rate:r,source:'手動匯率',endpoint:'',fetchedAt:'',quoteTime:'',error:'',attemptDay:''});save();settings();toast('已設定手動匯率')}
async function refreshRate(force=false){if(busy)return;if(!db.fx.endpoint){if(force)toast('請先儲存 Google 接口網址');return}if(!force&&db.fx.attemptDay===day())return;busy=true;db.fx.attemptDay=day();save();if(page==='settings')settings();const endpoint=db.fx.endpoint;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const u=new URL(endpoint);u.searchParams.set('_',Date.now());const res=await fetch(u.href,{signal:controller.signal,cache:'no-store',credentials:'omit'});if(!res.ok)throw Error('HTTP '+res.status);const x=await res.json();if(x.base!=='JPY'||x.quote!=='HKD'||typeof x.rate!=='number'||!Number.isFinite(x.rate)||x.rate<=0||x.error)throw Error('回應唔係有效 JPY/HKD 匯率');if(db.fx.endpoint!==endpoint)return;Object.assign(db.fx,{rate:x.rate,source:'Google Finance 經自訂 Sheets 接口',fetchedAt:new Date().toISOString(),quoteTime:typeof x.fetchedAt==='string'?x.fetchedAt:'',error:''});save();if(force)toast('匯率已更新')}catch(e){if(db.fx.endpoint===endpoint){db.fx.error='未能取得 Google 匯率，已保留舊值。請確認接口已公開部署，或稍後重試。';save();if(force)toast('更新失敗，已保留舊匯率')}}finally{clearTimeout(timer);busy=false;if(page==='settings'||['wish','places'].includes(page))render()}}
async function copyCode(){try{await navigator.clipboard.writeText(gas);toast('已複製')}catch{toast('瀏覽器未允許剪貼簿，請從程式區塊手動複製。')}}
function ai(){$('#app').innerHTML=heading('AI 整理助手','用收藏生成簡單草稿')+`<div class="notice">本頁為本機規則式整理，未接駁真正 AI，不會上傳收藏。路線未按距離最佳化，請自行核實交通、營業時間及預約。</div><div class="card"><label>收藏夾<select id="af"><option value="">全部收藏</option>${db.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><div class="toolbar"><button class="primary" onclick="organize('places')">行程草稿</button><button onclick="organize('wish')">購物清單</button><button onclick="organize('summary')">收藏摘要</button></div><p id="result" class="result muted">選擇功能開始整理。</p></div>`}
function organize(mode){const id=$('#af').value,a=db.items.filter(i=>!id||i.folder===id);let text='';if(mode==='summary')text='收藏摘要\n\n'+['places','wish','posts','info','links'].map(k=>keys[k][1]+'：'+a.filter(i=>i.type===k).length+' 項').join('\n');else{const b=a.filter(i=>i.type===mode&&!i.done);text=b.length?b.map((i,n)=>(mode==='wish'?'□ ':n+1+'. ')+i.name+(mode==='wish'?` — ${i.currency} ${i.price||0}${i.shop?'（'+i.shop+'）':''}`:i.address?' — '+i.address:'')).join('\n'):'未有待完成項目。';if(mode==='wish')text+='\n\n預算合計：約 HK$'+b.reduce((s,i)=>s+total(i),0).toFixed(1)+'（每項按一件計）';else text+='\n\n以上依收藏次序排列，請確認實際路線及開放時間。'}$('#result').textContent=text}
render();refreshRate();setInterval(()=>refreshRate(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRate()});
</script></html>
