alue=status;$('#status').onchange=e=>{status=e.target.value;reset();list()}}$('#sort').value=sort;$('#sort').onchange=e=>{sort=e.target.value;list()};list()}
function filter(k,v){if(k==='folder')folder=v;if(k==='tag')tag=v;reset();render()}function list(){const x=q.trim().toLowerCase();let a=db.items.filter(i=>i.type===page&&(!folder||(folder==='none'?!i.folder:i.folder===folder))&&(!tag||i.tags.includes(tag))&&(status==='all'||!!i.done===(status==='done'))&&(!x||(x.startsWith('#')?i.tags.some(t=>t.toLowerCase().includes(x.slice(1))):[i.name,i.url,i.address,i.city,i.country,i.brand,i.shop,i.note,fname(i.folder),...i.tags].join(' ').toLowerCase().includes(x))));if(sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));if(sort==='price')a.sort((a,b)=>amount(a)-amount(b));if(sort==='rating')a.sort((a,b)=>(b.rating||0)-(a.rating||0));visible=a.map(i=>i.id);$('#list').innerHTML=a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">未有符合條件嘅收藏。</div>';batch()}
function batch(){if(!$('#batch'))return;const all=visible.length>0&&visible.every(id=>selected.has(id));$('#batch').innerHTML=`<div class="batchbar"><label><input id="all" type="checkbox" ${all?'checked':''} onchange="selectAll(this.checked)" ${visible.length?'':'disabled'}>全選目前結果（${visible.length}）</label><span>已選 ${selected.size} 項</span><button onclick="selected.clear();refreshSelection()" ${selected.size?'':'disabled'}>取消選取</button><button class="danger" onclick="bulkDelete()" ${selected.size?'':'disabled'}>批量刪除</button></div>`;$('#all').indeterminate=!all&&visible.some(id=>selected.has(id))}function pick(id,v){if(v)selected.add(id);else selected.delete(id);refreshSelection()}function selectAll(v){visible.forEach(id=>{if(v)selected.add(id);else selected.delete(id)});refreshSelection()}function refreshSelection(){document.querySelectorAll('[data-check]').forEach(e=>e.checked=selected.has(e.dataset.check));document.querySelectorAll('[data-card]').forEach(e=>e.classList.toggle('selected',selected.has(e.dataset.card)));batch()}function bulkDelete(){const ids=[...selected].filter(id=>visible.includes(id));if(!ids.length)return;const folders=page==='folders',a=folders?db.folders:db.items,labels=ids.map(id=>a.find(i=>i.id===id)?.name);if(!confirm(`確定刪除 ${ids.length} ${folders?'個收藏夾':'項收藏'}？\n\n${labels.slice(0,8).join('\n')}${labels.length>8?'\n…':''}\n\n${folders?'內容會保留並移至未分類。':'此操作無法還原，建議先備份。'}`))return;const set=new Set(ids);if(folders){db.folders=db.folders.filter(f=>!set.has(f.id));db.items.forEach(i=>{if(set.has(i.folder))i.folder=''})}else db.items=db.items.filter(i=>!set.has(i.id));reset();save();render();toast('已批量刪除')}
function card(i){return `<article class="card ${selected.has(i.id)?'selected':''}" data-card="${i.id}">${i.type==='wish'?(safe(i.image)?`<img class="cover" src="${esc(safe(i.image))}" alt="${esc(i.name)}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="placeholder">${dog('wish')}</div>`):''}<div class="top"><div class="titlegroup"><input type="checkbox" data-check="${i.id}" ${selected.has(i.id)?'checked':''} aria-label="選取 ${esc(i.name)}" onchange="pick('${i.id}',this.checked)"><h3>${esc(i.name)}</h3></div><div class="actions"><button onclick="editItem('${i.id}')" aria-label="編輯">✎</button><button onclick="removeItem('${i.id}')" aria-label="刪除">×</button></div></div><div class="muted"><a href="#" onclick="event.preventDefault();${i.folder?`openFolder('${i.folder}')`:`go('folders')`}">♡ ${esc(fname(i.folder))}</a>　${esc(i.brand||i.city||i.country||'')}</div>${i.type!=='links'?`<p><button class="badge ${i.done?'done':''}" onclick="toggle('${i.id}')">${i.done?'✓ ':''}${i.type==='wish'?(i.done?'已買':'未買'):(i.done?'已去過':'未去過')}</button></p>`:''}${i.type==='places'?`<div class="stars">${'★'.repeat(i.rating||0)}${'☆'.repeat(5-(i.rating||0))} <small>${Number(i.rating||0).toFixed(1)}</small></div>`:''}<div class="tags">${i.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${i.address?`<p>⌖ <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.address+' '+i.name)}" target="_blank" rel="noopener noreferrer">${esc(i.address)}</a></p>`:''}${i.shop?`<p class="muted">▤ ${esc(i.shop)}</p>`:''}${i.note?`<p class="muted note">${esc(i.note)}</p>`:''}${safe(i.url)?`<div class="linkbox"><a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">↗ ${esc(i.url)}</a></div>`:''}${i.type!=='links'?`<p class="price">${i.currency==='JPY'?'≈ ':''}${hk(amount(i))}</p><div class="original">原價 ${i.currency==='JPY'?'¥':'HK$'}${Number(i.price||0).toLocaleString()}${i.currency==='JPY'?'<br>按參考匯率換算；不含手續費':''}</div>`:''}</article>`}
function foldersView(){visible=db.folders.map(f=>f.id);$('#app').innerHTML=heading('收藏夾','按旅程或主題整理所有內容。','<button class="primary" onclick="editFolder()">＋ 建立收藏夾</button>')+'<div id="batch"></div>'+`<div class="grid">${db.folders.map(f=>`<article class="card folder ${selected.has(f.id)?'selected':''}" data-card="${f.id}"><div class="top"><div class="titlegroup"><input type="checkbox" data-check="${f.id}" aria-label="選取 ${esc(f.name)}" ${selected.has(f.id)?'checked':''} onchange="pick('${f.id}',this.checked)"><h3>♡ ${esc(f.name)}</h3></div><div class="actions"><button onclick="editFolder('${f.id}')" aria-label="編輯收藏夾">✎</button><button onclick="removeFolder('${f.id}')" aria-label="刪除收藏夾">×</button></div></div><p class="muted">${esc(f.note)}</p><div class="tags">${types.map(k=>`<button class="tag" onclick="go('${k}','${f.id}')">${db.items.filter(i=>i.folder===f.id&&i.type===k).length} ${names[k]}</button>`).join('')}</div><p class="muted">${esc(f.country)}</p><button onclick="openFolder('${f.id}')">查看全部內容 →</button></article>`).join('')||'<div class="empty">未有收藏夾。</div>'}</div>`;batch()}function openFolder(id){page='folder';folder=id;reset();render();closeSide();scrollTo(0,0)}function folderDetail(){const f=db.folders.find(f=>f.id===folder);if(!f)return go('folders');const a=db.items.filter(i=>i.folder===folder);visible=a.map(i=>i.id);$('#app').innerHTML=heading(esc(f.name),esc(f.note),`<button onclick="editFolder('${f.id}')">編輯收藏夾</button>`)+`<div class="chips">${types.map(k=>`<button class="chip" onclick="go('${k}','${f.id}')">${names[k]} ${a.filter(i=>i.type===k).length}</button>`).join('')}</div><div id="batch"></div><div class="grid">${a.map(card).join('')||'<div class="empty">點選上方分類新增收藏。</div>'}</div>`;batch()}
function field(label,name,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`}function modal(title,body,done){$('#form').innerHTML=`<div class="top"><h3>${title}</h3><button type="button" onclick="closeModal()" aria-label="關閉">×</button></div>`+body+'<div class="formfoot"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存</button></div>';$('#form').onsubmit=e=>{e.preventDefault();done(new FormData(e.target))};$('#modal').showModal()}function closeModal(){$('#modal').close()}function options(id){return '<option value="">未分類</option>'+db.folders.map(f=>`<option value="${f.id}" ${id===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}
function editItem(id){const old=db.items.find(i=>i.id===id),i=old||{type:page,folder:folder==='none'?'':folder||db.folders[0]?.id||'',tags:[],currency:'HKD',country:''};modal((old?'編輯':'新增')+names[i.type],(i.type==='links'?field('有用連結／Reels／Threads 網址 *','url',i.url,'url',true):'')+field('名稱／標題 *','name',i.name,'text',true)+`<label>收藏夾<div class="inlinefolder"><select id="itemfolder" name="folder">${options(i.folder)}</select><button type="button" onclick="editFolder(null,true)">＋ 新建</button></div></label>`+(i.type!=='links'?`<div class="row">${field('國家／地區','country',i.country)}${field('城市','city',i.city)}</div>`:'')+field('標籤（空格、逗號或 # 分隔）','tags',i.tags.join(' '))+(i.type!=='links'?`<div class="row">${field('原幣金額','price',i.price||0,'number')}<label>原價貨幣<select name="currency"><option value="HKD" ${i.currency==='HKD'?'selected':''}>HKD 港幣</option><option value="JPY" ${i.currency==='JPY'?'selected':''}>JPY 日圓</option></select></label></div><label>狀態<select name="done"><option value="false" ${!i.done?'selected':''}>${i.type==='wish'?'未買':'未去過'}</option><option value="true" ${i.done?'selected':''}>${i.type==='wish'?'已買':'已去過'}</option></select></label>`:'')+(i.type==='places'?field('地址','address',i.address)+`<label>評分<select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===(i.rating||0)?'selected':''}>${n} 星</option>`).join('')}</select></label>`:'')+(i.type==='wish'?field('品牌','brand',i.brand)+field('店舖','shop',i.shop)+field('圖片網址（可選）','image',i.image,'url'):'')+(i.type!=='links'?field('相關連結','url',i.url,'url'):'')+`<label>備註<textarea name="note">${esc(i.note)}</textarea></label>`,fd=>{const x={...i,...Object.fromEntries(fd),id:old?.id||uid(),tags:[...new Set(String(fd.get('tags')).split(/[\s,#，]+/).filter(Boolean))],price:Number(fd.get('price')||0),rating:Number(fd.get('rating')||0),done:fd.get('done')==='true'};x.name=x.name.trim();if(!x.name)return toast('請輸入名稱');if(x.url&&!safe(x.url))return toast('只接受 http／https 網址');if(i.type==='links'&&!safe(x.url))return toast('請輸入有效網址');if(old)db.items[db.items.findIndex(i=>i.id===id)]=x;else db.items.push(x);save();closeModal();render();toast('已儲存')})}
function editFolder(id,inline=false){const f=db.folders.find(f=>f.id===id)||{};$('#folderform').innerHTML=`<div class="top"><h3>${id?'編輯':'建立'}收藏夾</h3><button type="button" onclick="$('#foldermodal').close()" aria-label="關閉">×</button></div>`+field('名稱 *','name',f.name,'text',true)+field('描述','note',f.note)+field('國家／地區（可選）','country',f.country)+'<div class="formfoot"><button type="button" onclick="$(\'#foldermodal\').close()">取消</button><button class="primary">儲存</button></div>';$('#folderform').onsubmit=e=>{e.preventDefault();const x={...Object.fromEntries(new FormData(e.target)),id:id||uid()};x.name=x.name.trim();if(!x.name)return toast('請輸入名稱');if(id)db.folders[db.folders.findIndex(f=>f.id===id)]=x;else db.folders.push(x);save();$('#foldermodal').close();if(inline&&$('#modal').open){$('#itemfolder').innerHTML=options(x.id);side()}else render();toast('收藏夾已儲存')};$('#foldermodal').showModal()}
function toggle(id){const i=db.items.find(i=>i.id===id);i.done=!i.done;save();render()}function removeItem(id){if(confirm('確定刪除？無法還原。')){db.items=db.items.filter(i=>i.id!==id);selected.delete(id);save();render()}}function removeFolder(id){if(confirm('刪除收藏夾？內容會保留並移至未分類。')){db.folders=db.folders.filter(f=>f.id!==id);db.items.forEach(i=>{if(i.folder===id)i.folder=''});selected.delete(id);save();render()}}
function backup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='tracy-notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('#upload').onchange=async e=>{try{if(!e.target.files[0])return;const x=normalize(JSON.parse(await e.target.files[0].text()));x.fx.endpoint='';if(confirm('會取代全部資料。舊貼文會歸入連結，情報不會匯入。確定？')){db=x;save();go('places');toast('已匯入，接口需重新設定')}}catch{toast('無效備份，未有更改資料')}e.target.value=''};
function fxSettings(){modal('港幣價格換算',`<div class="notice">主價格以港幣顯示，下面保留原價。未連接接口時使用示範／手動匯率，唔會標為今日報價。網站開啟時按香港日期每日嘗試取得一次；關閉網頁時不會背景更新。</div><p class="original">${fxLabel()}</p>`+field('1 JPY = 幾多 HKD','rate',db.fx.rate,'number',true)+field('Google Apps Script /exec 接口（可選）','endpoint',db.fx.endpoint,'url')+`<div class="notice">接口須回傳 JSON：<br><code>{"base":"JPY","quote":"HKD","rate":0.0495}</code><br>此數值僅示範。Google 試算表可用 GOOGLEFINANCE("CURRENCY:JPYHKD")，需自行部署 Apps Script 接口，純 HTML 未附帶已部署接口。介面顯示嘅係取得時間，唔係市場報價時間。</div><button type="button" onclick="refreshRate(true)">立即更新已儲存接口</button>`,fd=>{const r=Number(fd.get('rate')),endpoint=String(fd.get('endpoint')||'').trim();if(!Number.isFinite(r)||r<=0)return toast('請輸入有效正數');if(endpoint){try{const u=new URL(endpoint);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||! /^\/macros\/s\/[^/]+\/exec$/.test(u.pathname))throw Error()}catch{return toast('請輸入有效 Google Apps Script /exec 網址')}}const changed=r!==db.fx.rate;Object.assign(db.fx,{rate:r,endpoint,error:'',day:''});if(changed||!endpoint){db.fx.source='手動匯率';db.fx.updated=''}save();closeModal();render();if(endpoint)refreshRate(true)});$('#form [name=rate]').step='0.000001'}
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}async function refreshRate(force=false){if(busy)return;if(!db.fx.endpoint){if(force)toast('請先儲存 Google 接口');return}if(!force&&db.fx.day===day())return;busy=true;db.fx.day=day();save();const endpoint=db.fx.endpoint,c=new AbortController(),timer=setTimeout(()=>c.abort(),20000);try{const u=new URL(endpoint);u.searchParams.set('_',Date.now());const res=await fetch(u.href,{cache:'no-store',credentials:'omit',signal:c.signal});if(!res.ok)throw Error();const x=await res.json();if(x.base!=='JPY'||x.quote!=='HKD'||typeof x.rate!=='number'||!Number.isFinite(x.rate)||x.rate<=0)throw Error();if(db.fx.endpoint!==endpoint)return;Object.assign(db.fx,{rate:x.rate,source:'Google 經自訂接口參考匯率',updated:new Date().toISOString(),error:''});save();if(force)toast('匯率已更新')}catch{if(db.fx.endpoint===endpoint){db.fx.error='更新失敗';save();if(force)toast('無法取得匯率，已保留舊值')}}finally{clearTimeout(timer);busy=false;render()}}
save();render();refreshRate();setInterval(()=>refreshRate(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRate()});
</script></body></html>
