function render(){side();if(page==='folders')return foldersView();if(page==='folder')return folderDetail();const all=db.items.filter(i=>i.type===page);$('#app').innerHTML=heading(names[page],page==='wish'?`${all.length} 件產品 · 未買預算約 ${totalText(all.filter(i=>!i.done))}`:`${all.length} 個收藏`,`${page==='links'?'<button onclick="editFolder()">＋ 建立收藏夾</button>':''}<button class="primary" onclick="editItem()">＋ 新增${names[page]}</button>`)+(page!=='links'?`<div class="original">以 HKD 顯示估算，保留原幣價格及匯率日期。<a href="#" onclick="event.preventDefault();ratesDialog()">查看匯率</a>${fx.error?' · 更新失敗，沿用舊值':''}</div>`:'')+`<input id="search" class="search" aria-label="搜尋收藏" placeholder="搜尋名稱、網址、城市、備註，或者打 #標籤" value="${esc(q)}"><label>收藏夾／子分類<select id="folderfilter"><option value="">全部收藏夾</option><option value="none" ${folder==='none'?'selected':''}>未分類</option>${folderOptions(folder).replace('<option value="">未分類</option>','')}</select></label>${folder&&folder!=='none'?`<label style="display:flex;gap:8px;align-items:center;margin-bottom:15px"><input type="checkbox" ${directOnly?'checked':''} onchange="directOnly=this.checked;reset();list()">只顯示直接收藏，不包含子分類</label>`:''}<div class="chips">${[...new Set(all.flatMap(i=>i.tags))].map(t=>`<button class="tag ${tag===t?'active':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div><div class="toolbar">${page!=='links'?`<select id="state" aria-label="狀態"><option value="all">全部狀態</option><option value="todo">${page==='wish'?'未買':'未去過'}</option><option value="done">${page==='wish'?'已買':'已去過'}</option></select>`:''}<select id="sort" aria-label="排序"><option value="default">預設排序</option><option value="name">名稱排序</option>${page!=='links'?'<option value="price">港幣金額由低至高</option>':''}${page==='places'?'<option value="rating">評分由高至低</option>':''}</select><button onclick="go(page)">清除篩選</button></div><div id="batch"></div><div id="list"></div>`;$('#search').oninput=e=>{q=e.target.value;reset();list()};$('#folderfilter').onchange=e=>{folder=e.target. function list(){const x=q.trim().toLowerCase(),set=folder&&folder!=='none'?(directOnly?new Set([folder]):descendants(folder)):null;let a=db.items.filter(i=>i.type===page&&(!folder||(folder==='none'?!i.folder:set.has(i.folder)))&&(!tag||i.tags.includes(tag))&&(state==='all'||!!i.done===(state==='done'))&&(!x||(x.startsWith('#')?i.tags.some(t=>t.toLowerCase().includes(x.slice(1))):[i.name,i.url,i.address,i.city,i.country,i.brand,i.shop,i.note,fname(i.folder),...i.tags].join(' ').toLowerCase().includes(x))));if(sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));if(sort==='price')a.sort((a,b)=>(amount(a)??Infinity)-(amount(b)??Infinity));if(sort==='rating')a.sort((a,b)=>(b.rating||0)-(a.rating||0));visible=a.map(i=>i.id);$('#list').innerHTML=a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty">${dog(page)}仲未有收藏，按「新增」開始。</div>`;batch()}
function batch(){if(!$('#batch'))return;const all=visible.length>0&&visible.every(id=>selected.has(id));$('#batch').innerHTML=`<div class="batch"><label><input id="all" type="checkbox" ${all?'checked':''} onchange="selectAll(this.checked)" ${visible.length?'':'disabled'}>全選目前結果（${visible.length}）</label><span>已選 ${selected.size} 項</span><button onclick="selected.clear();refreshSelection()" ${selected.size?'':'disabled'}>取消選取</button><button class="danger" onclick="bulkDelete()" ${selected.size?'':'disabled'}>批量刪除</button></div>`;$('#all').indeterminate=!all&&visible.some(id=>selected.has(id))}function pick(id,v){if(v)selected.add(id);else selected.delete(id);refreshSelection()}function selectAll(v){visible.forEach(id=>{if(v)selected.add(id);else selected.delete(id)});refreshSelection()}function refreshSelection(){document.querySelectorAll('[data-check]').forEach(e=>e.checked=selected.has(e.dataset.check));document.querySelectorAll('[data-card]').forEach(e=>e.classList.toggle('selected',selected.has(e.dataset.card)));batch()}
function deleteFolders(ids){const set=new Set(ids);db.items.forEach(i=>{if(set.has(i.folder))i.folder=''});db.folders=db.folders.filter(f=>!set.has(f.id));db.folders.forEach(f=>{if(set.has(f.parentId))f.parentId=''})}function bulkDelete(){if(!canEdit())return;const ids=[...selected].filter(id=>visible.includes(id));if(!ids.length)return;const folders=page==='folders',a=folders?db.folders:db.items,labels=ids.map(id=>a.find(i=>i.id===id)?.name);if(!confirm(`確定刪除 ${ids.length} 項？\n\n${labels.slice(0,8).join('\n')}\n\n${folders?'只刪選取收藏夾。未選取的子分類會升為最上層；直接收藏移至未分類，所有收藏內容保留。':'刪除亦會同步雲端，無法還原，請先備份。'}`))return;if(folders)deleteFolders(ids);else{const set=new Set(ids);db.items=db.items.filter(i=>!set.has(i.id))}reset();changed();render()}
function card(i){return `<article class="card ${selected.has(i.id)?'selected':''}" data-card="${i.id}">${i.type==='wish'?(safe(i.image)?`<img class="cover" src="${esc(safe(i.image))}" alt="${esc(i.name)}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="placeholder">${dog('wish')}</div>`):''}<div class="top"><div class="titlegroup"><input type="checkbox" data-check="${i.id}" ${selected.has(i.id)?'checked':''} aria-label="選取 ${esc(i.name)}" onchange="pick('${i.id}',this.checked)"><h3>${esc(i.name)}</h3></div><div class="actions"><button onclick="editItem('${i.id}')" aria-label="編輯">✎</button><button onclick="removeItem('${i.id}')" aria-label="刪除">×</button></div></div><div class="muted"><a href="#" onclick="event.preventDefault();${i.folder?`openFolder('${i.folder}')`:`go('folders')`}">♡ ${esc(fname(i.folder))}</a>　${esc(i.brand||i.city||i.country||'')}</div>${i.type!=='links'?`<p><button class="badge ${i.done?'done':''}" onclick="toggle('${i.id}')">${i.done?'✓ ':''}${i.type==='wish'?(i.done?'已買':'未買'):(i.done?'已去過':'未去過')}</button></p>`:''}${i.type==='places'?`<div class="stars">${'★'.repeat(i.rating||0)}${'☆'.repeat(5-(i.rating||0))} <small>${Number(i.rating||0).toFixed(1)}</small></div>`:''}<div class="tags">${i.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${i.address?`<p>⌖ <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.address+' '+i.name)}" target="_blank" rel="noopener noreferrer">${esc(i.address)}</a></p>`:''}${i.shop?`<p class="muted">▤ ${esc(i.shop)}</p>`:''}${i.note?`<p class="muted note">${esc(i.note)}</p>`:''}${safe(i.url)?`<div class="linkbox"><a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">↗ ${esc(i.url)}</a></div>`:''}${i.type!=='links'?priceBlock(i):''}</article>`}
function folderCard(f,selectable=false){const a=scopedItems(f.id),kids=db.folders.filter(a=>a.parentId===f.id);return `<article class="card folder ${selected.has(f.id)?'selected':''}" data-card="${f.id}"><div class="top"><div class="titlegroup">${selectable?`<input type="checkbox" data-check="${f.id}" aria-label="選取 ${esc(f.name)}" ${selected.has(f.id)?'checked':''} onchange="pick('${f.id}',this.checked)">`:''}<h3>♡ ${esc(f.name)}</h3></div><div class="actions"><button onclick="editFolder('${f.id}')" aria-label="編輯收藏夾">✎</button><button onclick="removeFolder('${f.id}')" aria-label="刪除收藏夾">×</button></div></div>${f.parentId?`<div class="original">上層：${esc(fname(f.parentId))}</div>`:''}<p class="muted">${esc(f.note)}</p><div class="tags">${types.map(k=>`<button class="tag" onclick="go('${k}','${f.id}')">${a.filter(i=>i.type===k).length} ${names[k]}</button>`).join('')}</div><p class="original">${kids.length} 個子分類 · 數量包含下層收藏 ${esc(f.country||'')}</p><div class="toolbar"><button onclick="openFolder('${f.id}')">開啟</button><button onclick="editFolder(null,false,'${f.id}')">＋ 子分類</button></div></article>`}

function openFolder(id){page='folder';folder=id;directOnly=false;reset();render();closeSide();scrollTo(0,0)}function crumbs(id){return `<div class="crumb"><button onclick="go('folders')">全部收藏夾</button>${chain(id).map(f=>`<span>›</span><button onclick="openFolder('${f.id}')">${esc(f.name)}</button>`).join('')}</div>`}function folderDetail(){const f=getFolder(folder);if(!f)return go('folders');const kids=db.folders.filter(a=>a.parentId===folder),a=scopedItems(folder,directOnly);visible=a.map(i=>i.id);$('#app').innerHTML=crumbs(folder)+heading(esc(f.name),esc(f.note),`<button onclick="editFolder('${f.id}')">編輯</button><button class="primary" onclick="editFolder(null,false,'${f.id}')">＋ 子分類</button>`)+(kids.length?`<h3>子分類</h3><div class="grid">${kids.map(f=>folderCard(f)).join('')}</div>`:'')+`<div class="chips">${types.map(k=>`<button class="chip" onclick="go('${k}','${f.id}')">${names[k]} ${scopedItems(folder).filter(i=>i.type===k).length}</button>`).join('')}</div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" ${directOnly?'checked':''} onchange="directOnly=this.checked;reset();folderDetail()">只顯示直接收藏，不包含子分類</label><div id="batch"></div><div class="grid">${a.map(card).join('')||'<div class="empty">點選上方分類新增收藏，或者先建立子分類。</div>'}</div>`;batch()}
function field(label,name,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`}function modal(title,body,done){$('#form').innerHTML=`<div class="top"><h3>${title}</h3><button type="button" onclick="closeModal()" aria-label="關閉">×</button></div>`+body+'<div class="foot"><button type="button" onclick="closeModal()">取消</button><button class="primary">儲存</button></div>';$('#form').onsubmit=e=>{e.preventDefault();done(new FormData(e.target))};$('#modal').showModal()}function closeModal(){$('#modal').close()}
function preview(){const box=$('#pricepreview');if(!box)return;const n=Number($('#form [name=price]').value),c=$('#form [name=currency]').value,r=rate(c);if(!Number.isFinite(n)||n<0){box.textContent='請輸入有效價格';return}box.innerHTML=c==='HKD'?`<div class="estimate">價格：${hk(n)}</div><small>港幣原價，毋須換算。</small>`:`<div class="estimate">${r===null?'尚未取得匯率':`預估約 ${hk(n*r)}`}</div><small>${esc(dateLabel(c))}${r===null?'':` · 1 ${c} ≈ HK$${r.toPrecision(6)}`}</small>${r===null?'<br><button type="button" onclick="refreshRates(true)">立即取得匯率</button>':''}`}
function mapSearch(){const f=$('#form');if(!f)return;const name=f.querySelector('[name=name]')?.value.trim(),city=f.querySelector('[name=city]')?.value.trim(),address=f.querySelector('[name=address]')?.value.trim(),q=[name,city,address].filter(Boolean).join(' ');if(!q)return toast('請先填名稱、城市或地址');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener,noreferrer')}
function editItem(id){if(!canEdit())return;const old=db.items.find(i=>i.id===id),i=old||{type:page,folder:folder==='none'?'':folder||'',tags:[],currency:'HKD',country:''};modal((old?'編輯':'新增')+names[i.type],(i.type==='links'?field('有用連結／Reels／Threads 網址 *','url',i.url,'url',true):'')+field('名稱／標題 *','name',i.name,'text',true)+`<label>收藏夾／子分類<div class="inlinefolder"><select id="itemfolder" name="folder">${folderOptions(i.folder)}</select><button type="button" onclick="editFolder(null,true,$('#itemfolder').value)">＋ 新建</button></div></label>`+(i.type!=='links'?`<div class="row">${field('國家／地區','country',i.country)}${field('城市','city',i.city)}</div>`:'')+field('標籤（空格、逗號或 # 分隔）','tags',i.tags.join(' '))+(i.type!=='links'?`<div class="row">${field('價格（原幣）','price',i.price||0,'number')}<label>貨幣<select name="currency">${codes.map(c=>`<option value="${c}" ${c===i.currency?'selected':''}>${c} ${currencies[c]}</option>`).join('')}</select></label></div><div id="pricepreview" class="preview" aria-live="polite"></div><label>狀態<select name="done"><option value="false" ${!i.done?'selected':''}>${i.type==='wish'?'未買':'未去過'}</option><option value="true" ${i.done?'selected':''}>${i.type==='wish'?'已買':'已去過'}</option></select></label>`:'')+(i.type==='places'?field('地址','address',i.address)+`<div class="mapbtn"><button type="button" onclick="mapSearch()">喺 Google Maps 搜尋 ↗</button></div>`+`<label>評分<select name="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===(i.rating||0)?'selected':''}>${n} 星</option>`).join('')}</select></label>`:'')+(i.type==='wish'?field('品牌','brand',i.brand)+field('店舖','shop',i.shop)+field('圖片網址（可選）','image',i.image,'url'):'')+(i.type!=='links'?field('相關連結','url',i.url,'url'):'')+`<label>備註<textarea name="note">${esc(i.note)}</textarea></label>`,fd=>{if(!canEdit())return;const x={...i,...Object.fromEntries(fd),id:old?.id||uid(),tags:[...new Set(String(fd.get('tags')).split(/[\s,#，]+/).filter(Boolean))],price:Number(fd.get('price')||0),rating:Number(f function editFolder(id,inline=false,parent=''){if(!canEdit())return;const f=getFolder(id)||{},excluded=id?descendants(id):new Set();$('#ff').innerHTML=`<div class="top"><h3>${id?'編輯':parent?'建立子分類':'建立收藏夾'}</h3><button type="button" onclick="$('#fm').close()" aria-label="關閉">×</button></div>`+field('名稱 *','name',f.name,'text',true)+`<label>放喺邊個收藏夾下面？<select name="parentId">${folderOptions(id?f.parentId:parent,excluded,'最上層（獨立收藏夾）')}</select></label><div class="original">選擇上層即為子分類；編輯時不能放入自己或自己嘅下層。</div>`+field('描述','note',f.note)+field('國家／地區（可選）','country',f.country)+'<div class="foot"><button type="button" onclick="$(\'#fm\').close()">取消</button><button class="primary">儲存</button></div>';$('#ff').onsubmit=e=>{e.preventDefault();if(!canEdit())return;const x={...f,...Object.fromEntries(new FormData(e.target)),id:id||uid()};x.name=x.name.trim();if(!x.name)return toast('請輸入名稱');if(x.parentId&&(!getFolder(x.parentId)||excluded.has(x.parentId)))return toast('上層選擇無效');if(id)db.folders[db.folders.findIndex(f=>f.id===id)]=x;else db.folders.push(x);if(x.parentId)treeOpen.add(x.parentId);changed();$('#fm').close();if(inline&&$('#modal').open){$('#itemfolder').innerHTML=folderOptions(x.id);side()}else render();toast('收藏夾已儲存')};$('#fm').showModal()}
function toggle(id){if(!canEdit())return;const i=db.items.find(i=>i.id===id);i.done=!i.done;changed();render()}function removeItem(id){if(!canEdit())return;if(confirm('確定刪除？亦會同步雲端，無法還原。')){db.items=db.items.filter(i=>i.id!==id);selected.delete(id);changed();render()}}function removeFolder(id){if(!canEdit())return;if(confirm('只刪除此收藏夾？直接收藏移至未分類；子分類及其內容保留，子分類升為最上層。')){deleteFolders([id]);selected.delete(id);changed();render()}}
function backup(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({...db,exchangeRateReference:{rates:fx.rates,fetchedAt:fx.fetchedAt}},null,2)],{type:'application/json'}));a.href=u;a.download='tracy-notes-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('#upload').onchange=async e=>{try{if(!e.target.files[0]||!canEdit())return;const x=normalize(JSON.parse(await e.target.files[0].text()));if(confirm('將取代全部收藏，登入時亦會同步雲端。確定？')){db=x;changed();go('places');toast('已匯入')}}catch(e){toast('無效備份：'+e.message)}finally{e.target.value=''}};
function ratesTable(){return `<table><thead><tr><th>貨幣</th><th>1 單位 ≈ HKD</th><th>最後更新匯率日期</th></tr></thead><tbody>${codes.map(c=>`<tr><td>${c}<br><small>${currencies[c]}</small></td><td>${rate(c)===null?'未取得':Number(rate(c)).toPrecision(7)}</td><td>${c==='HKD'?'原幣，固定 1:1':fx.rates[c]?.date||'未取得'}</td></tr>`).join('')}</tbody></table><p class="original">來源：Frankfurter 每日參考匯率（非 Google），非銀行成交價；不含信用卡或兌換費用。<br>資料日期可能早於今日，不會用下載日期冒充報價日期。${fx.fetchedAt?'<br>最後成功檢查：'+esc(new Date(fx.fetchedAt).toLocaleString('zh-HK')):''}${fx.error?'<br>更新失敗，保留上次成功資料。':''}</p>`}function ratesDialog(){modal('六種貨幣及參考匯率',`<div class="notice">支援 JPY、HKD、CNY、TWD、KRW、USD。非港幣會即時估算 HKD。網站開啟時每日檢查，亦可立即更新。雲端同步只保存最新收藏，未有歷史備份。</div><div id="rates-table">${ratesTable()}</div><div class="toolbar"><button type="button" onclick="refreshRates(true)">立即更新匯率</button><button type="button" onclick="syncCloud()">立即同步雲端</button><button type="button" onclick="backup()">匯出 JSON</button></div>`,()=>closeModal());refreshRates()}
async function refreshRates(force=false){if(fxBusy)return;if(!force&&fx.checkedDay===day())return;fxBusy=true;fx.checkedDay=day();const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);try{const res=await fetch('https://api.frankfurter.dev/v2/rates?base=HKD&quotes=JPY,CNY,TWD,KRW,USD',{signal:ctrl.signal,cache:'no-store',credentials:'omit'});if(!res.ok)throw Error();const rows=await res.json();if(!Array.isArray(rows))throw Error();const next={};for(const c of codes.filter(c=>c!=='HKD')){const r=rows.find(r=>String(r.base).toUpperCase()==='HKD'&&String(r.quote).toUpperCase()===c);if(!r||typeof r.rate!=='number'||!Number.isFinite(r.rate)||r.rate<=0||! /^\d{4}-\d{2}-\d{2}$/.test(r.date))throw Error();next[c]={rate:1/r.rate,date:r.date}}fx.rates=next;fx.fetchedAt=new Date().toISOString();fx.error='';if(force)toast('外幣匯率已更新，HKD 固定 1:1')}catch{fx.error='更新失敗';if(force)toast('未能取得匯率，保留舊值，無舊值則不估算')}finally{clearTimeout(timer);fxBusy=false;try{localStorage.setItem('tracy-rates-v7',JSON.stringify(fx))}catch{}if($('#rates-table'))$('#rates-table').innerHTML=ratesTable();preview();render()}}
function err(e){const c=e?.code||'';if(c.includes('permission-denied'))return '權限不足：請檢查 Firestore 規則';if(c.includes('unauthorized-domain'))return '請將 keiyuennn.github.io 加入授權網域';if(c.includes('popup-blocked'))return '登入視窗被阻擋，請允許彈出視窗';if(c.includes('popup-closed'))return '登入視窗已關閉';if(c.includes('operation-not-allowed'))return '請在 Firebase 啟用 Google 登入';return c||e?.message||'網絡或設定問題'}function authUI(){$('#authui').innerHTML=user?`${esc(user.displayName||user.email||'已登入')} <button onclick="logout()">登出</button>`:'<button onclick="login()">使用 Google 登入</button>'}function notice(t=''){$('#cloudnotice').innerHTML=t}function fail(t){notice(`<div class="notice warn">${esc(t)}<div class="toolbar" style="margin-top:10px"><button onclick="reloadCloud()">重新讀取雲端</button><button onclick="backup()">先匯出本機備份</button></div></div>`)}async function login(){if(!api)return toast('登入服務尚未載入，請重新整理');if(writing)return toast('正在同步，請等候');try{await api.signInWithPopup(api.auth,new api.GoogleAuthProvider())}catch(e){toast(err(e));setStatus('登入未完成',true)}}async function logout(){if(!api)return;if(writing)return toast('同步中，請等候');if(dirty&&!confirm('仍有未上傳修改，會保留本機快取。確定登出？'))return;persist();try{await api.signOut(api.auth)}catch(e){toast(err(e))}}
async function openAccount(u){const token=++session;clearTimeout(debounce);if(unsub){unsub();unsub=null}if($('#modal').open)closeModal();if($('#fm').open)$('#fm').close();user=u;ready=false;writing=false;conflict=false;authUI();reset();if(!u){db=readCache(null)?.data||empty();dirty=false;baseRev=0;notice('');setStatus('本機模式 · 尚未登入');render();return}const c=readCache(u.uid);db=c?.data||empty();dirty=c?.dirty||false;baseRev=c?.rev||0;setStatus('讀取雲端資料…');notice('<div class="notice">正在讀取你的雲端收藏…</div>');render();try{const ref=api.doc(api.store,'users',u.uid,'state','main'),snap=await api.getDocFromServer(ref);if(token!==session)return;if(snap.exists()){const data=snap.data();if(c?.dirty){conflict=true;fail('此帳戶有未上傳本機修改，未有自動覆蓋。請先匯出備份，再重新讀取雲端。');setStatus('有未同步資料，等待處理',true);return}db=normalize(JSON.parse(data.payload));baseRev=data.revision||0;dirty=false}else{baseRev=0;if(!c){const guest=readCache(null);db=guest&&(guest.data.items.length||guest.data.folders.length)&&confirm('要將本機未登入收藏上傳到新帳戶嗎？')?guest.data:empty()}dirty=true}ready=true;conflict=false;notice('');persist();render();listen(ref,token);if(dirty)syncCloud();else setStatus('已連接雲端 · 最新資料')}catch(e){if(token!==session)return;ready=false;fail('未能讀取雲端：'+err(e));setStatus('雲端未連接，暫停修改',true)}}
function listen(ref,token){unsub=api.onSnapshot(ref,{includeMetadataChanges:true},snap=>{if(token!==session||snap.metadata.fromCache||snap.metadata.hasPendingWrites||!snap.exists())return;const d=snap.data(),rev=d.revision||0;if(writing&&d.client===client)return;if(rev===baseRev)return;if(dirty||writing||$('#modal').open||$('#fm').open){conflict=true;fail('其他裝置已更新，停止上傳。請先匯出本機備份，再重新讀取雲端。');setStatus('版本衝突，未覆蓋資料',true);return}try{db=normalize(JSON.parse(d.payload));baseRev=rev;dirty=false;persist();reset();render();setStatus('已接收其他裝置更新')}catch{setStatus('雲端資料格式有誤',true)}},e=>{if(token===session){setStatus('監聽失敗：'+err(e),true);fail('無法監聽雲端更新，請重新讀取。')}})}
async function syncCloud(){if(!user){toast('登入後先可以同步');return}if(!ready||conflict||writing||!dirty)return;if(!navigator.onLine){setStatus('離線：已暫存本機',true);return}const token=session,id=user.uid,payload=JSON.stringify(db),expected=baseRev,counter=change;if(new Blob([payload]).size>800000){setStatus('資料超過本版本容量，請匯出備份',true);return}writing=true;setStatus('同步中，請勿關閉頁面…');try{const ref=api.doc(api.store,'users',id,'state','main');await api.runTransaction(api.store,async tx=>{const s=await tx.get(ref),rev=s.exists()?(s.data().revision||0):0;if(rev!==expected)throw Error('VERSION_CONFLICT');tx.set(ref,{payload,revision:expected+1,client,updatedAt:api.serverTimestamp()})});if(token!==session)return;baseRev=expected+1;dirty=counter!==change;persist();setStatus(dirty?'仍有變更，等候同步…':'已同步雲端 · '+new Date().toLocaleTimeString('zh-HK'));if(dirty&&!conflict)debounce=setTimeout(syncCloud,700)}catch(e){if(token!==session)return;if(e.message==='VERSION_CONFLICT'){conflict=true;fail('雲端版本已改變，已阻止覆蓋。先匯出本機備份，再重新讀取。');setStatus('版本衝突，暫停上傳',true)}else{setStatus('未同步：'+err(e),true);fail('雲端儲存失敗，本機資料已保留，請匯出備份。');persist()}}finally{if(token===session)writing=false}}
async function reloadCloud(){if(!user)return;if(dirty||conflict){if(!confirm('會放棄未上傳本機修改，改用雲端資料。請先匯出 JSON。確定？'))return;dirty=false;persist()}await openAccount(user)}addEventListener('online',()=>{if(user&&ready&&!conflict)syncCloud();refreshRates(true)});addEventListener('offline',()=>{if(user)setStatus('離線 · 修改暫存本機',true)});addEventListener('beforeunload',e=>{if(dirty||writing){e.preventDefault();e.returnValue=''}});
async function init(){try{const root='https://www.gstatic.com/firebasejs/12.0.0/';const [a,b,c]=await Promise.all([import(root+'firebase-app.js'),import(root+'firebase-auth.js'),import(root+'firebase-firestore.js')]);const app=a.initializeApp({apiKey:'AIzaSyADhr0gBLcrGqTv0vk2jSmdvUxHxnL586I',authDomain:'tracy-notes2.firebaseapp.com',projectId:'tracy-notes2',storageBucket:'tracy-notes2.firebasestorage.app',messagingSenderId:'112237639906',appId:'1:112237639906:web:3bc821fa1b308f071986bb'});api={...b,...c,auth:b.getAuth(app),store:c.getFirestore(app)};b.onAuthStateChanged(api.auth,u=>openAccount(u))}catch{setStatus('Firebase 載入失敗 · 本機模式可用',true);fail('登入服務載入失敗，請檢查網絡可連接 Google 服務，再重新整理。')}}
render();setStatus('正在載入登入服務…');init();refreshRates();setInterval(()=>{if(user&&ready&&!conflict&&dirty&&!writing)syncCloud();refreshRates()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(user&&ready&&!conflict)syncCloud();refreshRates()}});
</script></body></html>
