let imageBusy=false,imageToken=0;function pickImage(input){const f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('請選擇圖片');if(f.size>15*1024*1024)return toast('圖片太大，請選細過 15MB');const token=++imageToken;imageBusy=true;const img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{try{if(token!==imageToken)return;const max=900,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/jpeg',.65);for(let z=0;out.length>48000&&z<5;z++){const n=document.createElement('canvas');n.width=Math.max(120,Math.round(c.width*.75));n.height=Math.max(1,Math.round(c.height*n.width/c.width));n.getContext('2d').drawImage(c,0,0,n.width,n.height);c.width=n.width;c.height=n.height;c.getContext('2d').drawImage(n,0,0);out=c.toDataURL('image/jpeg',.6)}const box=$('#imgpreview');if(box){box.innerHTML=`<img src="${out}" alt="圖片預覽"><button type="button" onclick="removeImage()">移除圖片</button>`;box.dataset.image=out}}catch{toast('無法處理圖片，請改用 JPG 或 PNG')}finally{URL.revokeObjectURL(url);if(token===imageToken)imageBusy=false}};img.onerror=()=>{URL.revokeObjectURL(url);if(token===imageToken){imageBusy=false;toast('無法讀取圖片，請改用 JPG 或 PNG')}};img.src=url}

function ratesTable(){return `<table><thead><tr><th>貨幣</th><th>1 單位 ≈ HKD</th><th>匯率資料日期</th></tr></thead><tbody>${codes.map(c=>`<tr><td>${c} ${currencies[c]}</td><td>${rate(c)===null?'未取得':Number(rate(c)).toPrecision(7)}</td><td>${c==='HKD'?'固定 1:1':fx.rates[c]?.date||'未取得'}</td></tr>`).join('')}</tbody></table><p class="original">Frankfurter 每日參考匯率，非銀行成交價；不含兌換／信用卡費用。不會以檢查時間冒充報價日期。${fx.fetchedAt?'<br>最後成功檢查：'+esc(new Date(fx.fetchedAt).toLocaleString('zh-HK')):''}${fx.error?'<br>更新失敗，沿用舊值。':''}</p>`}function ratesDialog(){modal('六種貨幣及參考匯率',`<div id="rates-table">${ratesTable()}</div><div class="toolbar"><button type="button" onclick="refreshRates(true)">立即更新匯率</button><button type="button" onclick="syncCloud()">立即同步雲端</button><button type="button" onclick="backup()">匯出 JSON</button></div>`,()=>closeModal());refreshRates()}
async function refreshRates(force=false){if(fxBusy||!force&&fx.checkedDay===day())return;fxBusy=true;fx.checkedDay=day();const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);try{const res=await fetch('https://api.frankfurter.dev/v2/rates?base=HKD&quotes=JPY,CNY,TWD,KRW,USD',{signal:ctrl.signal,cache:'no-store',credentials:'omit'});if(!res.ok)throw Error();const rows=await res.json();if(!Array.isArray(rows))throw Error();const next={};for(const c of codes.filter(c=>c!=='HKD')){const r=rows.find(r=>String(r.base).toUpperCase()==='HKD'&&String(r.quote).toUpperCase()===c);if(!r||typeof r.rate!=='number'||!Number.isFinite(r.rate)||r.rate<=0||! /^\d{4}-\d{2}-\d{2}$/.test(r.date))throw Error();next[c]={rate:1/r.rate,date:r.date}}fx.rates=next;fx.fetchedAt=new Date().toISOString();fx.error='';if(force)toast('參考匯率已更新')}catch{fx.error='更新失敗';if(force)toast('未能取得匯率，保留舊值；無舊值則不估算')}finally{clearTimeout(timer);fxBusy=false;try{localStorage.setItem('tracy-rates-v7',JSON.stringify(fx))}catch{}if($('#rates-table'))$('#rates-table').innerHTML=ratesTable();preview();if(!$('#modal').open&&!$('#fm').open){const focused=document.activeElement?.id,sel=$('#search')?.selectionStart;render();if(focused==='search'&&$('#search')){$('#search').focus();try{$('#search').setSelectionRange(sel,sel)}catch{}}}}}
function err(e){const c=e?.code||'';if(c.includes('permission-denied'))return '權限不足：請檢查 Firestore 規則';if(c.includes('unauthorized-domain'))return '請將 keiyuennn.github.io 加入授權網域';if(c.includes('popup-blocked'))return '請允許登入彈出視窗';if(c.includes('popup-closed'))return '登入視窗已關閉';if(c.includes('operation-not-allowed'))return '請在 Firebase 啟用 Google 登入';return c||e?.message||'網絡或設定問題'}function authUI(){$('#authui').innerHTML=user?`${esc(user.displayName||user.email||'已登入')} <button onclick="logout()">登出</button>`:'<button onclick="login()">使用 Google 登入</button>'}function notice(t=''){$('#cloudnotice').innerHTML=t}function fail(t){notice(`<div class="notice warn">${esc(t)}<div class="toolbar"><button onclick="reloadCloud()">重新讀取雲端</button><button onclick="backup()">先匯出本機備份</button></div></div>`)}async function login(){if(!api)return toast('登入服務尚未載入，請重新整理');if(writing)return toast('正在同步，請等候');try{await api.signInWithPopup(api.auth,new api.GoogleAuthProvider())}catch(e){toast(err(e));setStatus('登入未完成',true)}}async function logout(){if(!api)return;if(writing)return toast('同步中，請等候');if(dirty&&!confirm('仍有未上傳修改，會保留本機快取。確定登出？'))return;persist();try{await api.signOut(api.auth)}catch(e){toast(err(e))}}
async function openAccount(u){const token=++session;clearTimeout(debounce);if(unsub){unsub();unsub=null}if($('#modal').open)closeModal();if($('#fm').open)$('#fm').close();user=u;ready=false;writing=false;conflict=false;authUI();reset();if(!u){db=readCache(null)?.data||empty();dirty=false;baseRev=0;notice('');setStatus('本機模式 · 尚未登入');render();return}const c=readCache(u.uid);db=c?.data||empty();dirty=c?.dirty||false;baseRev=c?.rev||0;setStatus('讀取雲端資料…');notice('<div class="notice">正在讀取你的雲端收藏…</div>');render();try{const ref=api.doc(api.store,'users',u.uid,'state','main'),snap=await api.getDocFromServer(ref);if(token!==session)return;if(snap.exists()){const data=snap.data();if(c?.dirty){conflict=true;fail('此帳戶有未上傳本機修改，未有自動覆蓋。請先匯出備份，再重新讀取雲端。');setStatus('有未同步資料，等待處理',true);return}db=normalize(JSON.parse(data.payload));baseRev=data.revision||0;dirty=false}else{baseRev=0;if(!c){const guest=readCache(null);db=guest&&(guest.data.items.length||guest.data.folders.length)&&confirm('要將本機未登入收藏上傳到新帳戶嗎？')?guest.data:empty()}dirty=true}ready=true;notice('');persist();render();listen(ref,token);if(dirty)syncCloud();else setStatus('已連接雲端 · 最新資料')}catch(e){if(token!==session)return;ready=false;fail('未能讀取雲端：'+err(e));setStatus('雲端未連接，暫停修改',true)}}

async function syncCloud(){if(!user)return toast('登入後先可以同步');if(!ready||conflict||writing||!dirty)return;if(!navigator.onLine)return setStatus('離線：已暫存本機',true);const token=session,id=user.uid,payload=JSON.stringify(db),expected=baseRev,counter=change;if(new Blob([payload]).size>900000)return setStatus('資料太大，未能同步；請匯出備份並減少相片',true);writing=true;setStatus('同步中，請勿關閉頁面…');try{const ref=api.doc(api.store,'users',id,'state','main');await api.runTransaction(api.store,async tx=>{const s=await tx.get(ref),rev=s.exists()?(s.data().revision||0):0;if(rev!==expected)throw Error('VERSION_CONFLICT');tx.set(ref,{payload,revision:expected+1,client,updatedAt:api.serverTimestamp()})});if(token!==session)return;baseRev=expected+1;dirty=counter!==change;persist();setStatus(dirty?'仍有變更，等候同步…':'已同步雲端 · '+new Date().toLocaleTimeString('zh-HK'));if(dirty&&!conflict)debounce=setTimeout(syncCloud,700)}catch(e){if(token!==session)return;if(e.message==='VERSION_CONFLICT'){conflict=true;fail('雲端版本已改變，已阻止覆蓋。先匯出本機備份，再重新讀取。');setStatus('版本衝突，暫停上傳',true)}else{setStatus('未同步：'+err(e),true);fail('雲端儲存失敗，本機資料已保留，請匯出備份。');persist()}}finally{if(token===session)writing=false}}
